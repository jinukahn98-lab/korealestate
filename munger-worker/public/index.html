<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Munger Reading Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#f1eee5;color:#191713;font:14px system-ui,-apple-system,sans-serif}nav{position:sticky;top:0;z-index:3;display:flex;gap:5px;overflow:auto;padding:10px;background:#171610}nav button{border:0;border-radius:9px;padding:9px 11px;background:#2a2822;color:#ddd;white-space:nowrap}nav button.on{background:#f6f1e6;color:#171610}main{max-width:1080px;margin:auto;padding:24px}h1,h2,h3{font-family:Georgia,"Noto Serif KR",serif}h1{font-size:36px}.view{display:none}.view.on{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#fbf8f0;border:1px solid #d8d0c0;border-radius:14px;padding:16px}.card p{color:#68635a;line-height:1.6}.tag{font-size:10px;color:#91392c;font-weight:700}.ann{display:grid;grid-template-columns:110px 1fr;gap:12px;margin:10px 0}.ann img{width:100%;height:110px;object-fit:cover;border-radius:8px;image-rendering:auto}.note{border-left:3px solid #91392c;padding-left:10px}label.ck{display:block;padding:9px;border-bottom:1px solid #ddd}textarea,input[type=text]{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff}.lect{counter-reset:n}.lect div{padding:10px 0;border-bottom:1px solid #ddd}.lect div:before{counter-increment:n;content:counter(n,decimal-leading-zero)"  ";color:#98772f;font-family:Georgia}.muted{color:#777}@media(max-width:720px){.grid{grid-template-columns:1fr}main{padding:16px}h1{font-size:28px}.ann{grid-template-columns:90px 1fr}}</style><nav id="nav"></nav><main><section id="dashboard" class="view on"><p class="tag">PERSONAL DECISION SYSTEM</p><h1>멍거를 읽는 게 아니라, 써먹는 시스템</h1><p class="muted">원문 전체 복제 대신 핵심 개념·수기 메모·투자 체크리스트·복기 중심.</p><div id="core" class="grid"></div></section><section id="models" class="view"><h2>정신모형</h2><div id="modelsG" class="grid"></div></section><section p><b>의도 추정</b> · ${x[3]}</p></div></article>`).join('');let s=JSON.parse(localStorage.mc||'{}');cks.innerHTML=K.map((x,i)=>`<label class=ck><input type=checkbox data-i=${i} ${s[i]?'checked':''}> ${x}</label>`).join('');function up(){let a=[...document.querySelectorAll('#cks input')],d=a.filter(x=>x.checked).length;prog.textContent=`${d}/${a.length}`}cks.onchange=e=>{s[e.target.dataset.i]=e.target.checked;localStorage.mc=JSON.stringify(s);up()};up();ls.innerHTML=L.map(x=>`<div>${x}</div>`).join('');rt.value=localStorage.rt||'';rv.value=localStorage.rv||'';rt.oninput=e=>localStorage.rt=e.target.value;rv.oninput=e=>localStorage.rv=e.target.value;</script></html>
