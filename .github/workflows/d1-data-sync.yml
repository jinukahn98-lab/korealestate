name: Apply remote D1 migrations

on:
  workflow_dispatch:
    inputs:
      confirm_remote_d1:
        description: Type SYNC to apply migrations and refresh remote D1 data
        required: true
        type: string

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Verify explicit remote-D1 confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm_remote_d1 }}
        run: test "$CONFIRMATION" = "SYNC"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cf-worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: cf-worker
        run: npm ci

      - name: Create isolated Python environment for the sync script
        run: python3 -m venv venv

      - name: Apply remote D1 migrations
        working-directory: cf-worker
        run: CONFIRM_REMOTE_D1=1 ./scripts/apply_d1_migrations.sh remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Explain aggregate-data refresh
        run: |
          echo "D1 aggregate data is refreshed by the local exporter → Google Drive → Worker Cron path."
          echo "This workflow intentionally applies schema migrations only; it cannot access local SQLite source data."
