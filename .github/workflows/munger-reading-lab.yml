name: Deploy Munger Reading Lab

on:
  push:
    branches:
      - main
    paths:
      - 'munger-worker/**'
      - '.github/workflows/munger-reading-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: munger-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Munger Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx -y wrangler@4.118.0 deploy 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | tail -1 || true)
          if [ -z "$URL" ]; then
            URL="https://munger-reading-lab.joark-stock.workers.dev"
          fi
          printf '%s\n' "$URL" > DEPLOYED_URL.txt

      - name: Verify deployed app
        run: |
          URL=$(cat DEPLOYED_URL.txt)
          CODE=$(curl -L -A 'Mozilla/5.0' -sS -o deployed.html -w '%{http_code}' "$URL")
          echo "HTTP $CODE $URL"
          test "$CODE" = "200"
          grep -q '해설형 정리집' deployed.html
          grep -q '투자 원칙 체크리스트' deployed.html
          grep -q 'deep-dive.js' deployed.html
          JSCODE=$(curl -L -A 'Mozilla/5.0' -sS -o deep-dive.js -w '%{http_code}' "$URL/deep-dive.js")
          test "$JSCODE" = "200"
          grep -q '핵심 강연 5개' deep-dive.js
          grep -q 'CASE ATLAS' deep-dive.js
          grep -q '맥도널 더글러스' deep-dive.js

      - name: Record verified URL
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEPLOYED_URL.txt
          git commit -m 'chore: record verified Munger Worker URL [skip ci]' || exit 0
          git push
