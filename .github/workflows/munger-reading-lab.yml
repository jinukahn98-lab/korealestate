name: Deploy Munger Reading Lab

on:
  push:
    branches:
      - main
    paths:
      - 'munger-worker/**'
      - '.github/workflows/munger-reading-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: munger-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Munger Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx -y wrangler@4.118.0 deploy 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | tail -1 || true)
          if [ -z "$URL" ]; then
            URL="https://munger-reading-lab.joark-stock.workers.dev"
          fi
          printf '%s\n' "$URL" > DEPLOYED_URL.txt

      - name: Verify deployed app
        run: |
          python - <<'PY'
          import urllib.request
          url = open('DEPLOYED_URL.txt', encoding='utf-8').read().strip()
          with urllib.request.urlopen(url, timeout=30) as r:
              body = r.read().decode('utf-8', 'ignore')
              assert r.status == 200, r.status
              assert 'Munger Reading Lab' in body
              assert '수기 메모' in body
          print(url)
          PY

      - name: Record verified URL
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add munger-worker/DEPLOYED_URL.txt
          git commit -m 'chore: record verified Munger Worker URL [skip ci]' || exit 0
          git push
